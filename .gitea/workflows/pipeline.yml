# .gitea/workflows/pipeline.yml

name: Minimal DevSecOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: devsecops/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        run: |
          sudo apt update
          sudo apt install -y nodejs npm

      - name: Install dependencies
        run: npm install

      - name: Run app (basic test)
        run: |
          node index.js &
          sleep 3
          curl -f http://localhost:3000 || exit 1

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test

    defaults:
      run:
        working-directory: devsecops/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t test-app .
