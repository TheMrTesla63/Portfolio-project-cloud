name: DevSecOps Pipeline

"on":
  push:
    branches:
      - main

jobs:
  pipeline:
    name: Build Test Security Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build stage
        run: |
          docker build -t devsecops-app:latest devsecops/app

      - name: Test stage
        run: |
          docker rm -f devsecops-test || true
          docker run -d --name devsecops-test devsecops-app:latest
          sleep 5
          docker logs devsecops-test
          docker exec devsecops-test curl -f http://localhost:3000
          docker rm -f devsecops-test

      - name: Security stage - hardcoded secret check
        run: |
          if grep -Eq 'ADMIN_PASSWORD\s*=\s*".+"|ADMIN_PASSWORD\s*=\s*'\''.+'\''' devsecops/app/index.js; then
            echo "Hardcoded secret gevonden in devsecops/app/index.js"
            exit 1
          fi
          echo "Geen hardcoded secret gevonden"

      - name: Security stage - Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL \
            --exit-code 1 \
            --no-progress \
            devsecops-app:latest

      - name: Deploy stage
        run: |
          cd devsecops/app
          docker compose down || true
          docker rm -f devsecops-app || true
          docker compose up -d