# .gitea/workflows/pipeline.yml

name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t devsecops-app:latest devsecops/app

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Run test container
        run: |
          docker rm -f devsecops-test || true
          docker run -d -p 3002:3000 --name devsecops-test devsecops-app:latest
          sleep 5
          curl -f http://localhost:3002
          docker rm -f devsecops-test

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image devsecops-app:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Deploy application with Docker Compose
        run: |
          cd devsecops/app
          docker compose down || true
          docker compose up -d