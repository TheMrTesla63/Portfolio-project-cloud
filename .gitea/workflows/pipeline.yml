name: DevSecOps Pipeline

"on":
  push:
    branches:
      - main

jobs:
  pipeline:
    name: Build Test Security Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build stage
        run: |
          docker build -t devsecops-app:latest devsecops/app

      - name: Test stage
        run: |
          docker rm -f devsecops-test || true
          docker run -d --name devsecops-test devsecops-app:latest
          sleep 5
          docker logs devsecops-test
          docker exec devsecops-test curl -f http://localhost:3000
          docker rm -f devsecops-test

      - name: Security stage
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image devsecops-app:latest || true

      - name: Deploy stage
        run: |
          cd devsecops/app
          docker compose down || true
          docker compose up -d