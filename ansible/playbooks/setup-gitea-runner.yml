- name: Setup Gitea Actions runner
  hosts: devsecops
  become: true

  vars:
    gitea_runner_version: "0.3.1"
    gitea_url: "http://10.24.44.200:3000"

  tasks:
    - name: Download act_runner binary
      get_url:
        url: "https://dl.gitea.com/act_runner/{{ gitea_runner_version }}/act_runner-{{ gitea_runner_version }}-linux-amd64"
        dest: /usr/local/bin/act_runner
        mode: '0755'

    - name: Create required directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /etc/act_runner
        - /var/lib/act_runner

    - name: Create act_runner user
      user:
        name: act_runner
        system: true
        home: /var/lib/act_runner
        shell: /usr/sbin/nologin
        create_home: true

    - name: Add act_runner to docker group
      user:
        name: act_runner
        groups: docker
        append: true

    - name: Generate config if missing
      command: /usr/local/bin/act_runner generate-config
      args:
        creates: /etc/act_runner/config.yaml
      register: runner_config

    - name: Write config file
      copy:
        dest: /etc/act_runner/config.yaml
        content: "{{ runner_config.stdout }}"
        mode: '0644'
      when: runner_config.stdout is defined

    - name: Register runner (one-time setup)
      command: >
        /usr/local/bin/act_runner --config /etc/act_runner/config.yaml register
        --no-interactive
        --instance {{ gitea_url }}
        --token {{ gitea_runner_token }}
        --name monitoring-runner
        --labels ubuntu-latest
      args:
        chdir: /var/lib/act_runner
      when: gitea_runner_token is defined

    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/act_runner.service
        mode: '0644'
        content: |
          [Unit]
          Description=Gitea Actions runner
          After=docker.service

          [Service]
          ExecStart=/usr/local/bin/act_runner daemon --config /etc/act_runner/config.yaml
          WorkingDirectory=/var/lib/act_runner
          User=act_runner
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start runner
      systemd:
        name: act_runner
        enabled: true
        state: started
        daemon_reload: true