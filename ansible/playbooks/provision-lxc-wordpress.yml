---
- name: Provision Ubuntu LXC for WordPress on Proxmox
  hosts: proxmox
  become: true
  gather_facts: false

  vars:
    target_node: "pve01"

    ctid: 161
    hostname: "lxc-wp1"
    lxc_ip: "10.24.44.161/24"
    gateway: "10.24.44.1"

    cores: 1
    memory: 1024
    disk: "local-lvm:30"
    template: "local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst"

    ansible_bootstrap_user: "ansible"
    ansible_public_key_file: "/root/.ssh/id_ed25519.pub"

    inventory_file: "/home/monitoring/Portfolio-project-cloud/ansible/inventory/hosts.ini"
    inventory_group: "klant_lxc"

    temp_root_password: "tijdelijkWachtwoord123"

  tasks:
    - name: Only run on selected Proxmox node
      ansible.builtin.meta: end_host
      when: inventory_hostname != target_node

    - name: Check whether container already exists
      ansible.builtin.shell: "pct status {{ ctid }}"
      register: pct_status
      failed_when: false
      changed_when: false

    - name: Read public SSH key from monitoring server
      ansible.builtin.slurp:
        src: "{{ ansible_public_key_file }}"
      register: public_key_raw

    - name: Decode public SSH key
      ansible.builtin.set_fact:
        ansible_public_key: "{{ public_key_raw.content | b64decode | trim }}"

    - name: Create LXC container if missing
      ansible.builtin.command:
        argv:
          - pct
          - create
          - "{{ ctid }}"
          - "{{ template }}"
          - --hostname
          - "{{ hostname }}"
          - --cores
          - "{{ cores | string }}"
          - --memory
          - "{{ memory | string }}"
          - --rootfs
          - "{{ disk }}"
          - --net0
          - "name=eth0,bridge=vmbr0,ip={{ lxc_ip }},gw={{ gateway }}"
          - --unprivileged
          - "1"
          - --features
          - "nesting=1"
          - --password
          - "{{ temp_root_password }}"
      when: pct_status.rc != 0

    - name: Start container
      ansible.builtin.command: "pct start {{ ctid }}"
      register: pct_start
      failed_when: false
      changed_when: "'started' in pct_start.stdout or pct_start.rc == 0"

    - name: Wait a few seconds after start
      ansible.builtin.pause:
        seconds: 5

    - name: Install required bootstrap packages in container
      ansible.builtin.command: >
        pct exec {{ ctid }} -- bash -lc
        "apt-get update &&
         DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server sudo python3"
      register: bootstrap_packages
      changed_when: true

    - name: Enable SSH service in container
      ansible.builtin.command: >
        pct exec {{ ctid }} -- bash -lc
        "systemctl enable ssh && systemctl restart ssh"
      changed_when: true

    - name: Ensure ansible user exists
      ansible.builtin.command: >
        pct exec {{ ctid }} -- bash -lc
        "id -u {{ ansible_bootstrap_user }} >/dev/null 2>&1 ||
         useradd -m -s /bin/bash {{ ansible_bootstrap_user }}"
      changed_when: true

    - name: Ensure ansible user is in sudo group
      ansible.builtin.command: >
        pct exec {{ ctid }} -- bash -lc
        "usermod -aG sudo {{ ansible_bootstrap_user }}"
      changed_when: true

    - name: Create .ssh directory for ansible user
      ansible.builtin.command: >
        pct exec {{ ctid }} -- bash -lc
        "mkdir -p /home/{{ ansible_bootstrap_user }}/.ssh &&
         chown -R {{ ansible_bootstrap_user }}:{{ ansible_bootstrap_user }} /home/{{ ansible_bootstrap_user }}/.ssh &&
         chmod 700 /home/{{ ansible_bootstrap_user }}/.ssh"
      changed_when: true

    - name: Add public key to authorized_keys
      ansible.builtin.command: >
        pct exec {{ ctid }} -- bash -lc
        "grep -qxF '{{ ansible_public_key }}' /home/{{ ansible_bootstrap_user }}/.ssh/authorized_keys 2>/dev/null ||
         echo '{{ ansible_public_key }}' >> /home/{{ ansible_bootstrap_user }}/.ssh/authorized_keys &&
         chown {{ ansible_bootstrap_user }}:{{ ansible_bootstrap_user }} /home/{{ ansible_bootstrap_user }}/.ssh/authorized_keys &&
         chmod 600 /home/{{ ansible_bootstrap_user }}/.ssh/authorized_keys"
      changed_when: true

    - name: Configure passwordless sudo for ansible user
      ansible.builtin.command: >
        pct exec {{ ctid }} -- bash -lc
        "echo '{{ ansible_bootstrap_user }} ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/{{ ansible_bootstrap_user }} &&
         chmod 440 /etc/sudoers.d/{{ ansible_bootstrap_user }}"
      changed_when: true

    - name: Add new LXC to inventory group
      ansible.builtin.lineinfile:
        path: "{{ inventory_file }}"
        insertafter: '^\[{{ inventory_group }}\]$'
        line: "{{ hostname }} ansible_host={{ lxc_ip.split('/')[0] }} ansible_user={{ ansible_bootstrap_user }}"
        state: present

    - name: Show result
      ansible.builtin.debug:
        msg:
          - "LXC {{ hostname }} created or already present on {{ target_node }}"
          - "IP: {{ lxc_ip.split('/')[0] }}"
          - "Inventory updated: {{ inventory_file }}"
