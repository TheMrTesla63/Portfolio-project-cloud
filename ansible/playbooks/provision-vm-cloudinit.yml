---
- name: Provision Ubuntu VM with cloud-init on Proxmox
  hosts: proxmox
  become: true
  gather_facts: false

  vars:
    target_node: "pve01"

    vmid: 151
    vm_name: "vm-ha-wp1"

    cores: 2
    memory: 2048

    bridge: "vmbr0"
    storage_pool: "ceph-pool"
    image_file: "/var/lib/vz/template/iso/ubuntu-24.04-server-cloudimg-amd64.img"

    vm_ip: "10.24.44.151/24"
    gateway: "10.24.44.1"
    nameserver: "1.1.1.1"

    ci_user: "ansible"
    ssh_public_key_file: "/root/.ssh/id_ed25519.pub"

    inventory_file: "/home/monitoring/Portfolio-project-cloud/ansible/inventory/hosts.ini"
    inventory_group: "klant_vm_ha"

  tasks:
    - name: Only run on selected Proxmox node
      meta: end_host
      when: inventory_hostname != target_node

    - name: Check whether VM already exists
      command: "qm status {{ vmid }}"
      register: vm_status
      failed_when: false
      changed_when: false

    - name: Read SSH public key from control node
      set_fact:
        ssh_public_key: "{{ lookup('file', ssh_public_key_file) | trim }}"

    - name: Create VM
      command: >
        qm create {{ vmid }}
        --name {{ vm_name }}
        --memory {{ memory }}
        --cores {{ cores }}
        --net0 virtio,bridge={{ bridge }}
        --agent 1
        --ostype l26
        --scsihw virtio-scsi-single
        --serial0 socket
        --vga serial0
      when: vm_status.rc != 0

    - name: Import cloud image disk into Ceph
      command: >
        qm importdisk {{ vmid }} {{ image_file }} {{ storage_pool }}
      when: vm_status.rc != 0

    - name: Attach imported disk
      command: >
        qm set {{ vmid }} --scsi0 {{ storage_pool }}:vm-{{ vmid }}-disk-0
      when: vm_status.rc != 0

    - name: Add cloud-init drive
      command: >
        qm set {{ vmid }} --ide2 {{ storage_pool }}:cloudinit
      when: vm_status.rc != 0

    - name: Set boot order
      command: >
        qm set {{ vmid }} --boot order=scsi0
      when: vm_status.rc != 0

    - name: Set cloud-init user
      command: >
        qm set {{ vmid }} --ciuser {{ ci_user }}
      when: vm_status.rc != 0

    - name: Copy SSH public key to Proxmox node temporarily
      copy:
        dest: "/tmp/vm-{{ vmid }}-id_ed25519.pub"
        content: "{{ ssh_public_key }}\n"
        mode: "0600"
      when: vm_status.rc != 0

    - name: Set cloud-init SSH key
      command: >
        qm set {{ vmid }} --sshkeys /tmp/vm-{{ vmid }}-id_ed25519.pub
      when: vm_status.rc != 0

    - name: Remove temporary SSH public key file
      file:
        path: "/tmp/vm-{{ vmid }}-id_ed25519.pub"
        state: absent
      when: vm_status.rc != 0

    - name: Set cloud-init IP config
      command: >
        qm set {{ vmid }} --ipconfig0 ip={{ vm_ip }},gw={{ gateway }}
      when: vm_status.rc != 0

    - name: Set DNS nameserver
      command: >
        qm set {{ vmid }} --nameserver {{ nameserver }}
      when: vm_status.rc != 0

    - name: Resize disk to 32G
      command: >
        qm resize {{ vmid }} scsi0 32G
      when: vm_status.rc != 0

    - name: Start VM
      command: "qm start {{ vmid }}"
      failed_when: false

    - name: Wait for SSH port to become reachable
      wait_for:
        host: "{{ vm_ip.split('/')[0] }}"
        port: 22
        delay: 10
        timeout: 300
        state: started
      delegate_to: localhost
      become: false
      run_once: true

    - name: Wait for VM to accept Ansible connection
      wait_for_connection:
        delay: 5
        timeout: 300

    - name: Ensure inventory group exists
      lineinfile:
        path: "{{ inventory_file }}"
        line: "[{{ inventory_group }}]"
        state: present
      delegate_to: localhost
      become: false
      run_once: true

    - name: Add VM to inventory
      lineinfile:
        path: "{{ inventory_file }}"
        insertafter: '^\[{{ inventory_group }}\]$'
        line: "{{ vm_name }} ansible_host={{ vm_ip.split('/')[0] }} ansible_user={{ ci_user }}"
        state: present
      delegate_to: localhost
      become: false
      run_once: true

    - name: Show result
      debug:
        msg:
          - "VM {{ vm_name }} created on {{ target_node }}"
          - "IP: {{ vm_ip.split('/')[0] }}"
          - "Cloud-init user: {{ ci_user }}"