---
- name: Configure Proxmox HA for VMs from inventory
  hosts: proxmox
  become: true
  gather_facts: false

  vars:
    target_node: "pve01"

  tasks:
    - name: Only run on one Proxmox node
      meta: end_host
      when: inventory_hostname != target_node

    - name: Add VMs from klant_vm_ha group to HA
      command: >
        ha-manager add vm:{{ hostvars[item].vmid }}
      register: ha_add_result
      failed_when: >
        ha_add_result.rc != 0 and
        ('already' not in (ha_add_result.stderr | default('') | lower))
      changed_when: ha_add_result.rc == 0
      loop: "{{ groups['klant_vm_ha'] }}"
      when: hostvars[item].vmid is defined

    - name: Enable HA service for VMs
      command: >
        ha-manager set vm:{{ hostvars[item].vmid }} --state started
      register: ha_set_result
      failed_when: ha_set_result.rc != 0
      changed_when: ha_set_result.rc == 0
      loop: "{{ groups['klant_vm_ha'] }}"
      when: hostvars[item].vmid is defined

    - name: Show HA config
      command: ha-manager config
      register: ha_config
      changed_when: false

    - name: Print HA config
      debug:
        var: ha_config.stdout