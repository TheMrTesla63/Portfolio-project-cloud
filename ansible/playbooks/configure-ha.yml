---
- name: Configure Proxmox HA for VMs from inventory
  hosts: proxmox
  become: true
  gather_facts: false

  vars:
    target_node: "pve01"
    ha_group: "ha-group"
    ha_nodes: "PVE01,PVE02,PVE03"

  tasks:
    - name: Only run on one Proxmox node
      meta: end_host
      when: inventory_hostname != target_node

    - name: Create HA group
      command: >
        ha-manager groupadd {{ ha_group }} --nodes {{ ha_nodes }}
      register: ha_group_result
      failed_when: false
      changed_when: "'already exists' not in (ha_group_result.stderr | default(''))"

    - name: Add VMs from klant_vm_ha group to HA
      command: >
        ha-manager add vm:{{ hostvars[item].vmid }} --group {{ ha_group }}
      register: ha_add_result
      failed_when: false
      changed_when: "'already' not in (ha_add_result.stderr | default(''))"
      loop: "{{ groups['klant_vm_ha'] }}"

    - name: Enable HA service for VMs
      command: >
        ha-manager set vm:{{ hostvars[item].vmid }} --state started
      failed_when: false
      loop: "{{ groups['klant_vm_ha'] }}"

    - name: Show HA status
      command: ha-manager status
      register: ha_status
      changed_when: false

    - name: Print HA status
      debug:
        var: ha_status.stdout