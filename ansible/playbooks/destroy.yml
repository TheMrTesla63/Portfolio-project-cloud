---
- name: Destroy all customer infrastructure
  hosts: proxmox
  become: true
  gather_facts: false

  vars:
    target_node: "pve01"
    confirm_destroy: false   # 🔴 zet op true om echt te slopen

  tasks:
    - name: Safety check
      fail:
        msg: "Set confirm_destroy=true to actually destroy everything"
      when: not confirm_destroy

    - name: Only run on one Proxmox node
      meta: end_host
      when: inventory_hostname != target_node

    # =====================
    # HA verwijderen
    # =====================

    - name: Remove VMs from HA
      command: >
        ha-manager remove vm:{{ hostvars[item].vmid }}
      failed_when: false
      loop: "{{ groups['klant_vm_ha'] | default([]) }}"
      when: hostvars[item].vmid is defined

    # =====================
    # VM's stoppen en verwijderen
    # =====================

    - name: Stop VMs
      command: qm stop {{ hostvars[item].vmid }}
      failed_when: false
      loop: "{{ groups['klant_vm_ha'] | default([]) }}"
      when: hostvars[item].vmid is defined

    - name: Destroy VMs
      command: qm destroy {{ hostvars[item].vmid }} --purge
      failed_when: false
      loop: "{{ groups['klant_vm_ha'] | default([]) }}"
      when: hostvars[item].vmid is defined

    # =====================
    # LXC stoppen en verwijderen
    # =====================

    - name: Stop LXCs
      command: pct stop {{ hostvars[item].ctid }}
      failed_when: false
      loop: "{{ groups['klant_lxc'] | default([]) }}"
      when: hostvars[item].ctid is defined

    - name: Destroy LXCs
      command: pct destroy {{ hostvars[item].ctid }}
      failed_when: false
      loop: "{{ groups['klant_lxc'] | default([]) }}"
      when: hostvars[item].ctid is defined

    # =====================
    # Result
    # =====================

    - name: Done
      debug:
        msg: "All VMs and LXCs destroyed (if confirm_destroy=true)"