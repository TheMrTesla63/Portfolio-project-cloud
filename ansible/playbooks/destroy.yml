---
- name: Destroy all customer infrastructure and cleanup traces
  hosts: proxmox
  become: true
  gather_facts: false

  vars:
    target_node: "pve01"
    confirm_destroy: false   # zet op true om echt uit te voeren

    inventory_file: "/home/monitoring/Portfolio-project-cloud/ansible/inventory/hosts.ini"
    vm_group: "klant_vm_ha"
    lxc_group: "klant_lxc"

  tasks:
    - name: Safety check
      fail:
        msg: "Set confirm_destroy=true to actually destroy everything"
      when: not confirm_destroy

    - name: Only run on one Proxmox node
      meta: end_host
      when: inventory_hostname != target_node

    - name: Build combined guest list
      set_fact:
        destroy_hosts: "{{ (groups[vm_group] | default([])) + (groups[lxc_group] | default([])) }}"

    # =====================
    # HA verwijderen
    # =====================

    - name: Remove VMs from HA
      command: "ha-manager remove vm:{{ hostvars[item].vmid }}"
      failed_when: false
      changed_when: false
      loop: "{{ groups[vm_group] | default([]) }}"
      when: hostvars[item].vmid is defined

    # =====================
    # VM's stoppen en verwijderen
    # =====================

    - name: Stop VMs
      command: "qm stop {{ hostvars[item].vmid }}"
      failed_when: false
      changed_when: false
      loop: "{{ groups[vm_group] | default([]) }}"
      when: hostvars[item].vmid is defined

    - name: Wait briefly after stopping VMs
      pause:
        seconds: 5

    - name: Destroy VMs
      command: "qm destroy {{ hostvars[item].vmid }} --purge"
      failed_when: false
      changed_when: false
      loop: "{{ groups[vm_group] | default([]) }}"
      when: hostvars[item].vmid is defined

    # =====================
    # LXC stoppen en verwijderen
    # =====================

    - name: Stop LXCs
      command: "pct stop {{ hostvars[item].ctid }}"
      failed_when: false
      changed_when: false
      loop: "{{ groups[lxc_group] | default([]) }}"
      when: hostvars[item].ctid is defined

    - name: Wait briefly after stopping LXCs
      pause:
        seconds: 5

    - name: Destroy LXCs
      command: "pct destroy {{ hostvars[item].ctid }} --purge"
      failed_when: false
      changed_when: false
      loop: "{{ groups[lxc_group] | default([]) }}"
      when: hostvars[item].ctid is defined

    # =====================
    # SSH known_hosts cleanup
    # =====================

    - name: Remove hostname entries from known_hosts
      command: "ssh-keygen -R {{ item }}"
      failed_when: false
      changed_when: false
      loop: "{{ destroy_hosts }}"

    - name: Remove IP entries from known_hosts
      command: "ssh-keygen -R {{ hostvars[item].ansible_host }}"
      failed_when: false
      changed_when: false
      loop: "{{ destroy_hosts }}"
      when: hostvars[item].ansible_host is defined

    # =====================
    # Inventory cleanup
    # =====================

    - name: Remove destroyed host lines from inventory
      lineinfile:
        path: "{{ inventory_file }}"
        regexp: "^{{ item }}\\s"
        state: absent
      loop: "{{ destroy_hosts }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Done
      debug:
        msg:
          - "Destroyed all VMs and LXCs"
          - "Removed known_hosts entries"
          - "Removed host lines from inventory, group headers kept intact"